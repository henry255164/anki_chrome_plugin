<!-- floating-ui.html -->
<div class="header">
  Anki Web Clipper
</div>
<div class="content">
  <div class="anki-clipper-content-flex">
    <div class="anki-field-group">
      <label for="anki-question-field" class="anki-label">Question (Front)</label>
      <textarea id="anki-question-field" class="anki-textarea"></textarea>
    </div>

    <div class="anki-field-group">
      <label for="anki-answer-field" class="anki-label">Answer (Back)</label>
      <textarea id="anki-answer-field" class="anki-textarea"></textarea>
    </div>

    <div class="anki-footer">
      <span id="anki-status-msg"></span>
      <button id="anki-submit-btn" class="anki-submit-btn">Add to Anki</button>
    </div>
  </div>
</div>
