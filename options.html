<!DOCTYPE html>
<html>

<head>
  <title>Anki Web Clipper Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <h1>Anki Web Clipper Settings</h1>
    <h2>Hotkeys</h2>
    <div class="setting">
      <label for="question-hotkey">Add to Question:</label>
      <input type="text" id="question-hotkey" readonly>
    </div>
    <div class="setting">
      <label for="answer-hotkey">Add to Answer:</label>
      <input type="text" id="answer-hotkey" readonly>
    </div>
    <p>Click on an input box and press your desired key combination (e.g., Alt + Q).</p>

    <button id="save">Save</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>

</html>
